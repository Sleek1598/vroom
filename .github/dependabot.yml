version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'thursday'
      time: '08:00'
      timezone: 'Africa/Johannesburg'
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: 'gitsubmodule'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'thursday'
      time: '08:20'
      timezone: 'Africa/Johannesburg'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'deps(submodules)'
